name: Godot regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
      - name: Download and verify Godot 4.7.2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $RUNNER_TEMP/godot.zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Install Chinese font fallback
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk fontconfig
          fc-match "Noto Sans CJK SC"
      - name: Download and import current runtime assets
        run: python3 tools/bootstrap_project.py --download --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --timeout 360
      - name: Run suite
        run: python3 tests/run_tests.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --timeout 360
